<style>
/* =========================================================
   Cloto · solo hilos
   ========================================================= */
:root {
  --accent:#93b5ea; --accent2:#b9abe6;
  --ui:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', sans-serif;
}
body[data-theme=light] {
  --bg:#f4f4f6; --text:#1d1d1f; --muted:#8a8a90; --hover:rgba(0,0,0,.045);
  --edge:color-mix(in srgb, #3c3c50 30%, #f4f4f6);
  --aura:.36;
  --glass:rgba(255,255,255,.7); --line:rgba(0,0,0,.06); --hi:rgba(255,255,255,.8);
  --shadow:0 1px 3px rgba(40,40,70,.05), 0 12px 36px rgba(40,40,70,.10);
}
body[data-theme=dark] {
  --bg:#17181b; --text:#ececef; --muted:#85868e; --hover:rgba(255,255,255,.045);
  --edge:color-mix(in srgb, #ffffff 24%, #17181b);
  --aura:.24;
  --glass:rgba(46,47,52,.64); --line:rgba(255,255,255,.07); --hi:rgba(255,255,255,.06);
  --shadow:0 1px 3px rgba(0,0,0,.3), 0 14px 40px rgba(0,0,0,.4);
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--text);
  font:13px/1.45 var(--ui); -webkit-font-smoothing:antialiased;
  -webkit-user-select:none; user-select:none; transition:background .3s, color .3s;
}

/* ---------- fondo etéreo ---------- */
#aura { position:fixed; inset:-10vmax; overflow:hidden; pointer-events:none; opacity:var(--aura); transition:opacity .6s; }
#aura i { position:absolute; border-radius:50%; will-change:transform, opacity;
  background:radial-gradient(closest-side, var(--c) 0%,
    color-mix(in srgb, var(--c) 78%, transparent) 18%, color-mix(in srgb, var(--c) 50%, transparent) 38%,
    color-mix(in srgb, var(--c) 24%, transparent) 58%, color-mix(in srgb, var(--c) 8%, transparent) 78%, transparent 100%); }
#aura i:nth-child(1) { width:70vmax; height:70vmax; left:-20vmax; top:-25vmax; --c:var(--accent);  animation:d1 70s ease-in-out infinite alternate, pulse 23s ease-in-out infinite alternate; }
#aura i:nth-child(2) { width:65vmax; height:65vmax; right:-22vmax; bottom:-28vmax; --c:var(--accent2); animation:d2 83s ease-in-out infinite alternate, pulse 29s ease-in-out -9s infinite alternate; }
#aura i:nth-child(3) { width:50vmax; height:50vmax; left:35%; top:25%; --c:color-mix(in srgb, var(--accent) 50%, var(--accent2)); animation:d3 97s ease-in-out infinite alternate, pulse 31s ease-in-out -15s infinite alternate; }
#aura i:nth-child(4) { width:45vmax; height:45vmax; right:5%; top:-15vmax; --c:var(--accent2); animation:d4 76s ease-in-out infinite alternate, pulse 37s ease-in-out -4s infinite alternate; }
#aura i:nth-child(5) { width:48vmax; height:48vmax; left:-10vmax; bottom:-20vmax; --c:var(--accent);  animation:d5 89s ease-in-out infinite alternate, pulse 27s ease-in-out -20s infinite alternate; }
@keyframes d1 { 50% { transform:translate(22vmax,14vmax) scale(1.15); } 100% { transform:translate(8vmax,30vmax) scale(.9); } }
@keyframes d2 { 50% { transform:translate(-25vmax,-8vmax) scale(.85); } 100% { transform:translate(-10vmax,-26vmax) scale(1.1); } }
@keyframes d3 { 50% { transform:translate(-26vmax,12vmax) scale(1.3); } 100% { transform:translate(18vmax,-14vmax) scale(.8); } }
@keyframes d4 { 50% { transform:translate(-30vmax,24vmax) scale(1.2); } 100% { transform:translate(-8vmax,40vmax) scale(.9); } }
@keyframes d5 { 50% { transform:translate(30vmax,-18vmax) scale(.9); } 100% { transform:translate(45vmax,-4vmax) scale(1.2); } }
@keyframes pulse { from { opacity:.45; } to { opacity:1; } }
@media (prefers-reduced-motion: reduce) { #aura i { animation:none; } }

/* ---------- lienzo ---------- */
#stage { position:fixed; inset:0; touch-action:none; }
body.panning #stage { cursor:grabbing; }
body.grabbing, body.grabbing * { cursor:grabbing !important; }
body.pulling #stage, body.pulling .node, body.pulling .elab, body.pulling .edge .hit { cursor:crosshair; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }
#edges { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; pointer-events:none; }

/* hilos */
.edge { --ec:var(--edge); }
.edge .hit  { fill:none; stroke:transparent; stroke-width:16; pointer-events:stroke; cursor:grab; }
.edge .line { fill:none; stroke:var(--ec); stroke-width:var(--sw, 1.3); stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:var(--da, none); }
.edge.hov .line { stroke-width:calc(var(--sw, 1.3) + .5px); }
.edge .halo { fill:none; stroke:var(--accent); stroke-opacity:.38; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
.debris { fill:none; stroke-width:1.3; stroke-linecap:round; pointer-events:none; }

/* ---------- nodos ---------- */
.node {
  position:absolute; min-width:40px; width:max-content; padding:8px 14px; border-radius:9px;
  font:14px/1.45 var(--ui); transition:background .25s, box-shadow .25s;
}
.node.wt { min-width:0; padding:1px 7px; border-radius:7px; font:11px/1.5 var(--ui); letter-spacing:.01em; color:var(--muted); background:var(--bg); text-align:center; }
.node.wt.sel, .node.wt.editing { color:var(--text); }
.node.wt .t { min-height:0; min-width:2ch; }
.node .t { position:relative; z-index:1; white-space:pre; outline:none; min-height:1.45em; min-width:1ch; }
.node.editing { cursor:text; }
.node.editing .t { -webkit-user-select:text; user-select:text; cursor:text; caret-color:var(--accent); }
.node::before { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; border:1.3px solid transparent; transition:border-color .25s; }
.node[data-fr="solid"]::before { border-color:var(--nc, var(--edge)); }
.node[data-fr="dash"]::before { border:1.3px dashed var(--nc, var(--edge)); }
.node[data-col] { background:color-mix(in srgb, var(--nc) 13%, transparent); }
.node:hover { background:var(--hover); }
.node.sel, .node.editing { background:color-mix(in srgb, var(--accent) 13%, transparent); }
.node.src { animation:breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { background:color-mix(in srgb, var(--accent) 22%, transparent); } }
.node.target { background:color-mix(in srgb, var(--accent) 16%, transparent); box-shadow:0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); }

/* etiquetas de hilo */
.elab { position:absolute; transform:translate(-50%,-50%); z-index:1; padding:1px 7px; border-radius:7px; min-width:2ch; text-align:center;
  font:11px/1.5 var(--ui); letter-spacing:.01em; color:var(--muted); white-space:pre; pointer-events:auto; outline:none;
  background:var(--bg); transition:color .2s, background .2s; }                 /* opaca: el hilo nunca se ve a través */
.elab.sel { color:var(--text); }
.elab.src, .elab.target { box-shadow:0 0 0 1.5px color-mix(in srgb, var(--accent) 60%, transparent); }
.elab.editing { pointer-events:auto; cursor:text; color:var(--text); -webkit-user-select:text; user-select:text; caret-color:var(--accent);
  background:color-mix(in srgb, var(--accent) 14%, var(--bg)); }

/* buscador: atenúa lo que no coincide */
.finding .node:not(.fm) { opacity:.25; }
.finding .elab:not(.fm) { color:color-mix(in srgb, var(--muted) 30%, transparent); }   /* se atenúa el texto, no la caja: sigue tapando el hilo */
.finding .node, .finding .elab { transition:opacity .2s, background .25s, box-shadow .25s; }
.node.fc { background:color-mix(in srgb, var(--accent) 22%, transparent); box-shadow:0 0 0 1.5px color-mix(in srgb, var(--accent) 70%, transparent); }
#find, #pbar, #kbar { position:fixed; top:14px; left:50%; z-index:58; display:flex; align-items:center; gap:10px; padding:7px 14px; border-radius:14px;
  opacity:0; pointer-events:none; transform:translate(-50%,-6px) scale(.98); transition:opacity .15s, transform .15s cubic-bezier(.2,.9,.3,1.2); }
#find.open, #pbar.open, #kbar.open { opacity:1; pointer-events:auto; transform:translate(-50%,0); }
#find input, #pbar input, #kbar input { width:min(240px, 52vw); border:0; outline:0; background:none; color:var(--text); font:13px var(--ui);
  -webkit-user-select:text; user-select:text; caret-color:var(--accent); }
#find input::placeholder, #pbar input::placeholder, #kbar input::placeholder { color:var(--muted); }
#kbar input { width:min(330px, 70vw); }
#kbar .kl { display:grid; color:var(--muted); }
#kbar.bad { animation:shake .32s; }
@keyframes shake { 20%, 60% { transform:translate(calc(-50% - 6px), 0); } 40%, 80% { transform:translate(calc(-50% + 6px), 0); } }
#find .cnt { font-size:11px; color:var(--muted); min-width:3ch; text-align:right; font-variant-numeric:tabular-nums; }

/* menú circular (clic derecho en un hilo) */
#ring { position:fixed; z-index:60; width:0; height:0; display:none; }
#ring.open { display:block; }
#ring .bg { position:absolute; left:-98px; top:-98px; width:196px; height:196px; border-radius:50%; animation:ringbg .16s ease-out;
  background:var(--glass); border:1px solid var(--line); box-shadow:inset 0 1px 0 var(--hi), var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(1.7); backdrop-filter:blur(24px) saturate(1.7); }
#ring .it { position:absolute; border-radius:50%; cursor:pointer; display:grid; place-items:center; animation:ringpop .18s cubic-bezier(.2,.9,.3,1.3) both;
  transition:transform .1s, box-shadow .15s, background .15s, color .15s; }
#ring .it:hover { transform:scale(1.14); }
#ring .it.st { color:var(--muted); background:var(--hover); }
#ring .it.st:hover, #ring .it.st.on { color:var(--text); }
#ring .it.c { box-shadow:inset 0 0 0 1px var(--line); }
#ring .it.on { box-shadow:inset 0 0 0 1px var(--line), 0 0 0 2.5px var(--glass), 0 0 0 4px var(--muted); }
#ring .it.pick { background:conic-gradient(#e58c8f, #e6ac6a, #7dbf91, #7aa7e6, #a993e3, #df93bf, #e58c8f); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden; }
#ring .it.pick input { position:absolute; inset:-4px; width:30px; height:30px; opacity:0; cursor:pointer; border:0; padding:0; }
#ring .ctr { position:absolute; left:-46px; top:-10px; width:92px; text-align:center; font:500 11px/20px var(--ui); color:var(--muted); pointer-events:none; }
#ring .it.none { background:linear-gradient(135deg, transparent 45%, var(--muted) 45%, var(--muted) 55%, transparent 55%); }
@keyframes ringpop { from { transform:scale(.3); opacity:0; } }
@keyframes ringbg { from { transform:scale(.6); opacity:0; } }

/* flechas, islas */
.edge .knot { fill:var(--ec); pointer-events:none; }
#isl { position:absolute; left:0; top:0; width:1px; height:1px; overflow:visible; pointer-events:none; }
.ilab { position:absolute; z-index:1; padding:2px 8px; border-radius:7px; min-width:3ch; font:11px/1.5 var(--ui); letter-spacing:.05em; white-space:pre; outline:none; cursor:grab;
  color:color-mix(in srgb, var(--nc, var(--muted)) 75%, var(--text)); transition:background .2s; }
.ilab:empty::before { content:'isla'; opacity:.45; }
.ilab:hover { background:var(--hover); }
.ilab.editing { cursor:text; -webkit-user-select:text; user-select:text; caret-color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--bg)); }

/* ayuda: el único botón */
#helpbtn { position:fixed; left:14px; bottom:14px; z-index:57; width:26px; height:26px; border-radius:50%; border:0; background:none; color:var(--muted);
  font:500 13px var(--ui); cursor:pointer; opacity:.4; transition:opacity .2s, background .2s, color .2s; }
#helpbtn:hover, #helpbtn.on { opacity:1; color:var(--text); background:var(--glass); }
#help { position:fixed; left:14px; bottom:82px; z-index:56; width:min(350px, calc(100vw - 28px)); max-height:calc(100vh - 80px); overflow:auto; padding:6px 16px 12px; border-radius:18px;
  opacity:0; pointer-events:none; transform:translateY(6px) scale(.98); transform-origin:0 100%; transition:opacity .15s, transform .15s cubic-bezier(.2,.9,.3,1.2); }
#help.open { opacity:1; pointer-events:auto; transform:none; }
#help .hl { font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:12px 0 4px; }
#help .hr { display:flex; justify-content:space-between; gap:16px; padding:2px 0; font-size:12px; }
#help .hr kbd { font:11px var(--ui); color:var(--muted); text-align:right; }

/* multimedia */
.node.media { display:flex; flex-direction:column; gap:6px; padding:8px; }
.node.media .mb { order:-1; position:relative; border-radius:6px; overflow:hidden; line-height:0; pointer-events:none; }
.node.media .mb img, .node.media .mb video { display:block; max-width:none; height:auto; }
.node.media .t { padding:0 6px 2px; font-size:12px; color:var(--muted); }
.node.media:not(.editing) .t:empty { display:none; }
.node.m-url { cursor:pointer; }
.node.m-url .t { white-space:pre-wrap; max-width:240px; font-size:13px; color:var(--text); }
.node.m-url .mb img { width:240px; }
.node.media .mf { order:2; padding:0 6px 2px; font-size:11px; color:var(--muted); letter-spacing:.01em; }
.node.media .mb.fc { display:flex; align-items:center; gap:10px; padding:4px 6px; line-height:1.45; overflow:visible; }
.fc b { font:600 10px var(--ui); letter-spacing:.06em; padding:3px 6px; border-radius:6px; background:var(--hover); color:var(--muted); }
.fc span { font-size:13px; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.mb.missing { white-space:pre-line; width:160px; height:96px; display:grid; place-items:center; border:1.3px dashed var(--edge); border-radius:6px; font-size:11px; line-height:1.4; text-align:center; padding:6px; color:var(--muted); }
.pl { position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; background:rgba(20,20,24,.34); }
.pl::after { content:''; position:absolute; left:14px; top:10px; border-left:10px solid #fff; border-top:7px solid transparent; border-bottom:7px solid transparent; }
.node.playing .pl { display:none; }
#lb { position:fixed; inset:0; z-index:70; display:none; place-items:center; background:rgba(10,10,14,.5); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); cursor:zoom-out; }
#lb.open { display:grid; }
#lb img, #lb .fr { display:none; }
#lb.is-img img { display:block; max-width:90vw; max-height:90vh; border-radius:10px; box-shadow:var(--shadow); }
#lb.is-fr .fr { display:flex; flex-direction:column; align-items:center; gap:10px; }
#lb iframe { width:min(1100px, 92vw); height:min(80vh, 780px); border:0; border-radius:12px; background:#fff; box-shadow:var(--shadow); }
#lb .go { font:11px var(--ui); letter-spacing:.01em; color:rgba(255,255,255,.7); text-decoration:none; }
#lb .go:hover { color:#fff; }
.mb.wait { width:240px; height:135px; background:var(--hover); animation:shim 1.2s ease-in-out infinite alternate; }
@keyframes shim { from { opacity:.45; } to { opacity:1; } }
.node.playing .fc b { background:color-mix(in srgb, var(--accent) 30%, transparent); color:var(--text); }
#dlbtn { position:fixed; left:14px; bottom:44px; z-index:57; width:26px; height:26px; border-radius:50%; border:0; background:none; color:var(--muted);
  display:grid; place-items:center; cursor:pointer; opacity:.4; transition:opacity .2s, background .2s, color .2s; }
#dlbtn:hover { opacity:1; color:var(--text); background:var(--glass); }

#hintweb { display:none; } body.web #hintweb { display:inline; }
#note { position:fixed; left:50%; bottom:18px; z-index:59; padding:6px 14px; border-radius:12px; font-size:12px; color:var(--text); white-space:nowrap;
  opacity:0; pointer-events:none; transform:translate(-50%,6px); transition:opacity .2s, transform .2s; }
#note.on { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
#note.link { cursor:pointer; }

#marquee { position:fixed; display:none; z-index:40; pointer-events:none; border-radius:4px;
  border:1px solid color-mix(in srgb, var(--accent) 70%, transparent); background:color-mix(in srgb, var(--accent) 10%, transparent); }

/* ---------- pista (solo con el lienzo vacío) ---------- */
#hint { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:none; text-align:center;
  color:var(--muted); font-size:12px; line-height:2.1; letter-spacing:.01em; opacity:0; transition:opacity .6s; }
#hint.on { opacity:.8; }
#hint b { font-weight:500; color:var(--text); }

/* ---------- el único menú: colores de hilo + archivo ---------- */
.glass {
  background:var(--glass); border:1px solid var(--line); box-shadow:inset 0 1px 0 var(--hi), var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(1.7); backdrop-filter:blur(24px) saturate(1.7);
}
</style>
</head>
<body data-theme="light">

<div id="aura"><i></i><i></i><i></i><i></i><i></i></div>
<div id="stage">
  <div id="world"><svg id="isl"><g id="islg"></g></svg><svg id="edges"><g id="edgeg"></g></svg></div>

    if (d.base) fileBase = d.base;
    ingest(d); rebuild();
    if (d.view && isFinite(d.view.k)) view = { x: +d.view.x || 0, y: +d.view.y || 0, k: clampK(+d.view.k) };
    if (KINDS.includes(d.kind)) kind = d.kind;
    if (d.base) fileBase = d.base;
  }
} catch (e) {}
applyView(); updateTitle(); updateHint();
hist = [snapshot()]; hi = 0;
idb.sweep(lock || lockedStart ? null : cachePrefix());     // limpieza: solo quedan las copias del proyecto abierto (y ninguna si tiene contraseña)
if (lockedStart) {
  if (DESK) startUnlock();
  else if (WEB) { lockedStart = false; note((isNamed() ? '«' + fileBase + '»' : 'El último proyecto') + ' tiene contraseña: ábrelo con ' + MOD + 'O'); fileBase = 'hilo'; persist(); updateTitle(); }
}
})();
